name: Release

# Publier une version : créer une release sur GitHub dont le tag est le numéro
# de version de manifest.json (ex. 0.3.2). Ce workflow compile le plugin,
# signe les fichiers (attestation de provenance), les joint à la release et
# remplit la description depuis CHANGELOG.md si elle est vide.
on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Le tag doit être la version de manifest.json
        run: test "$(node -p "require('./manifest.json').version")" = "$TAG"
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Attester la provenance des fichiers
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Joindre les fichiers à la release
        run: gh release upload "$TAG" main.js manifest.json styles.css --clobber
      - name: Remplir la description depuis CHANGELOG.md si elle est vide
        run: |
          body="$(gh release view "$TAG" --json body --jq .body)"
          notes="$(awk -v tag="$TAG" '$0 == "## " tag {on=1; next} /^## / {on=0} on' CHANGELOG.md)"
          if [ -z "$body" ] && [ -n "$notes" ]; then
            gh release edit "$TAG" --notes "$notes"
          fi
