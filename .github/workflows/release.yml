name: Release

# Deux façons de publier une version (même numéro que manifest.json, ex. 0.3.1) :
#  - créer une release sur GitHub avec un nouveau tag → ce workflow y joint les fichiers ;
#  - ou pousser le tag (git tag 0.3.1 && git push --tags) → ce workflow crée la release.
on:
  release:
    types: [published]
  push:
    tags: ["*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npm test
      - run: npm run build
      - name: Joindre main.js, manifest.json, styles.css à la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" main.js manifest.json styles.css --clobber
          else
            gh release create "$TAG" main.js manifest.json styles.css --title "$TAG" --generate-notes
          fi
